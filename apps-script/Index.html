<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <?!= include('Styles'); ?>
</head>
<body>
  <div class="app">
    <!-- Loading / error -->
    <div id="boot" class="boot" role="status">Loading attendance…</div>

    <!-- TAKE ATTENDANCE -->
    <section id="view-take" class="view" hidden>
      <header class="top">
        <div class="top-row">
          <div class="titles">
            <span class="eyebrow">YPAM · Aaniin</span>
            <h1>Take attendance</h1>
          </div>
          <label class="class-pick">
            <span class="sr-only">Class</span>
            <select id="class-select"></select>
          </label>
        </div>

        <div class="session-nav">
          <button type="button" class="icon-btn" id="prev-session" aria-label="Previous session">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <div class="session-label">
            <span id="session-date" class="session-date"></span>
            <span id="session-count" class="muted-sm"></span>
          </div>
          <button type="button" class="icon-btn" id="next-session" aria-label="Next session">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>

        <div class="stat-row">
          <div class="stat stat-p"><span id="count-p" class="stat-num">0</span><span class="stat-label">Present</span></div>
          <div class="stat stat-a"><span id="count-a" class="stat-num">0</span><span class="stat-label">Absent</span></div>
          <div class="stat stat-n"><span id="count-n" class="stat-num">0</span><span class="stat-label">Not marked</span></div>
        </div>
      </header>

      <div class="list-head">
        <span id="student-total" class="list-count"></span>
        <button type="button" id="mark-rest" class="text-btn">Mark rest present</button>
      </div>

      <ul id="take-list" class="list"></ul>

      <div class="save-bar">
        <div id="save-msg" class="banner" role="status" hidden></div>
        <button type="button" id="save-btn" class="primary-btn">Save to Google Sheet</button>
      </div>
    </section>

    <!-- MEMBERS -->
    <section id="view-members" class="view" hidden>
      <header class="top">
        <div class="titles">
          <span id="members-eyebrow" class="eyebrow"></span>
          <h1>Members</h1>
          <span id="members-sub" class="muted"></span>
        </div>
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <span class="sr-only">Search members</span>
          <input id="member-search" type="search" placeholder="Search members" autocomplete="off">
        </label>
        <div class="segmented" role="group" aria-label="Sort members">
          <button type="button" id="sort-low" aria-pressed="true">Lowest first</button>
          <button type="button" id="sort-az" aria-pressed="false">A–Z</button>
        </div>
      </header>
      <ul id="member-list" class="list"></ul>
    </section>

    <!-- DASHBOARD -->
    <section id="view-dashboard" class="view" hidden>
      <header class="top">
        <div class="titles">
          <span id="dash-eyebrow" class="eyebrow"></span>
          <h1>Dashboard</h1>
          <span id="dash-sub" class="muted"></span>
        </div>
      </header>
      <main class="dash">
        <section class="kpis" aria-label="Key numbers">
          <div class="card kpi"><span class="kpi-label">Average turnout</span><span id="kpi-avg" class="kpi-num blue"></span><span id="kpi-avg-sub" class="muted-sm"></span></div>
          <div class="card kpi"><span class="kpi-label">Last session</span><span id="kpi-last" class="kpi-num"></span><span id="kpi-last-sub" class="muted-sm"></span></div>
          <div class="card kpi"><span class="kpi-label">Sessions done</span><span id="kpi-done" class="kpi-num"></span><span id="kpi-done-sub" class="muted-sm"></span></div>
          <div class="card kpi"><span class="kpi-label">Perfect record</span><span id="kpi-perfect" class="kpi-num"></span><span class="muted-sm">students at 100%</span></div>
        </section>

        <section class="card chart-card" aria-label="Turnout by session">
          <div class="card-head"><h2>Turnout by session</h2><span class="muted-sm">% present</span></div>
          <div class="chart-scroll">
            <div id="chart" class="chart" role="img"></div>
          </div>
        </section>

        <section class="card insights" aria-label="What stands out">
          <h2>What stands out</h2>
          <div id="insights"></div>
        </section>
      </main>
    </section>

    <nav id="tabbar" class="tabbar" aria-label="Main" hidden>
      <button type="button" data-tab="take" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
        Take
      </button>
      <button type="button" data-tab="members">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Members
      </button>
      <button type="button" data-tab="dashboard">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M8 17v-6"/><path d="M13 17V7"/><path d="M18 17v-4"/></svg>
        Dashboard
      </button>
    </nav>
  </div>

  <?!= include('App'); ?>
</body>
</html>
